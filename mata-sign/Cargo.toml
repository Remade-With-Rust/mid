[package]
name = "mata-sign"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/mid"
edition = "2021"
description = "Sign arbitrary content as a did:mata, verifiable offline by anyone. Generalizes mID from identity claims to arbitrary documents/messages — the primitive under internal MATA document signing + IAMHUMAN public-post signing. M1 of the Signing Primitive Mission."

[lib]
crate-type = ["rlib"]

[dependencies]
# The signing-side core, reused verbatim: the embedded-roster wire types,
# IdentitySnapshot, the JWS compact encoder (build_jws_compact), the canonical
# byte forms, and the DeviceSigner trait re-export. mata-sign does NOT
# reimplement any of this — it produces a different *payload* (content instead
# of identity claims) through the same audited machinery.
mid-issuer = { path = "../mid-issuer", version = "0.2.0" }

# The verification-side core, reused verbatim: the four self-contained checks
# (genesis self-sig → roster chain → head VM → JWS signature), the JWS splitter,
# header validation, and key/DID decoding. mata-sign hands these a synthetic
# payload shaped from its own statement — no crypto is re-rolled here.
mid-verify = { path = "../mid-verify", version = "0.2.0" }

# JSON serialization of the signed-statement payload (the JWS second segment).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# base64url (no padding) — content-hash encoding + reading the JWS signature
# segment. Same engine the rest of the mID stack uses.
base64 = "0.22"

# SHA-256 of the content being signed (detached model: we sign the hash).
sha2 = "0.10"

# base58btc encoding of the IAMHUMAN proof address (`iamhuman_post_id`) — the
# same encoding DIDs use. Shared here so the host and the extension derive
# byte-identical addresses from one implementation.
bs58 = "0.5"

# Typed error variants.
thiserror = "1"

[dev-dependencies]
# In-memory P-256 signer for round-trip tests (the production signer is the
# vault-loaded / Secure-Enclave device key, injected behind DeviceSigner).
kms-client = { path = "../kms-client", version = "0.2.0" }
# Construct deterministic SigningKeys from a seed in tests + self-sign the
# genesis roster the same way the wallet does (mirrors the mid-verify fixtures).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
