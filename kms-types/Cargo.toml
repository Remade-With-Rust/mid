[package]
name = "kms-types"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/mid"
edition = "2021"
description = "Shared envelope types for MATA's KMS sovereign-auth (NonceEnvelope, SignedAssertion, RosterUpdate, DidDocumentV2). Phase 1 of the Phase 1 Wallet Overhaul Mission."

[lib]
crate-type = ["rlib"]

[dependencies]
# Serde for JSON wire format. No platform-specific features needed.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# base64url (no padding) — the wire encoding for binary fields (nonce, pubkey,
# signature) per docs/kms/envelope_spec.md.
base64 = "0.22"

# SHA-256 for canonical_bytes(). Pure Rust, no_std-friendly, wasm-compatible.
sha2 = "0.10"

# Typed error variants per envelope_spec.md §"Error taxonomy".
thiserror = "1"

[dev-dependencies]
# Round-trip tests use pretty-printed JSON for readable failures.
serde_json = "1"
