[package]
name = "mid-verify"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/mid"
readme = "README.md"
keywords = ["identity", "authentication", "did", "jwt", "mid"]
categories = ["authentication", "cryptography"]
description = "mID JWT verifier — RP-side. Runs the four-step verification (genesis self-sig → roster chain → head VM → JWS signature) entirely locally per ADR 0005 Decision 1. Zero runtime calls to MATA infrastructure. Phase 0 of the mID Mission."

[lib]
crate-type = ["rlib"]

[dependencies]
# Shared wire-format types + canonical-bytes producer for the embedded
# rosters. The wallet (via mid-issuer) and this crate both consume the
# same canonical_bytes module — single source of truth for the signing
# form.
mid-issuer = { path = "../mid-issuer", version = "0.2.0" }

# ECDSA P-256 verification primitives. Same crate `kms-client` uses for
# signing, so the wire format matches exactly. `ecdsa` feature pulls in
# Signature + VerifyingKey + signature::Verifier impls.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

# SHA-256 prehash for ECDSA verification. Pure Rust, wasm-compatible.
sha2 = "0.10"

# base64url (no padding) — JWS compact form per RFC 7515 §3.
base64 = "0.22"

# base58btc for DID-encoded genesis pubkey decoding + multibase pubkey
# decoding on roster VMs (matches the `did:mata:<base58>` format defined
# by `kms-types::did`).
bs58 = "0.5"

# JSON deserialization of the JWT payload (the embedded rosters arrive
# inside the JSON). Reuses the same `MidJwtPayload` struct produced by
# the issuer.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Typed error variants per ADR 0005.
thiserror = "1"

[dev-dependencies]
# Hex fields of the derived-identity vector (tests only; in Cargo.lock already).
hex = "0.4"
# In-memory signer + deterministic test fixtures use kms-client's
# `DeviceSigner` trait + `InMemoryDeviceSigner` to mint test JWTs via
# `mid-issuer` and then verify them in this crate's tests.
kms-client = { path = "../kms-client", version = "0.2.0" }
# p256 directly so test fixtures can construct SigningKeys from a
# deterministic seed (matches the mid-issuer test fixture pattern).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
